# Builds the mod and publishes a jar.
#
# Where to get a jar:
#   - push a tag like v1.0.0 -> builds and attaches the jar to a release
#   - Actions -> "Build" -> Run workflow, with a version -> same, tag and all
#   - Actions -> "Build" -> Run workflow, blank -> just builds an artifact
#   - open a PR touching the mod -> same artifact, on the run's summary page
#
# Note: push triggers here are tags only. GitHub ANDs ref filters with path
# filters, so a workflow filtered on paths will not run for a tag push at all.
name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 1.0.0. Leave blank to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Loom 1.18 needs a JDK 25 to run, even though the mod targets Java 21.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon

      # The mod ships no unit tests: the check that matters is whether the
      # remapped jar loads on a stock server next to Fabric API, so boot one and
      # read the log. Nothing is sent to the server's console — commands piped
      # to its stdin are not reliable enough to gate a build on, which is how
      # this step failed the first time it ran.
      - name: Boot a dedicated server with the jar installed
        run: |
          set -euo pipefail
          mkdir -p smoke/mods && cd smoke
          curl -sSL --retry 3 -o server.jar \
            "https://meta.fabricmc.net/v2/versions/loader/1.21.11/0.19.5/1.1.0/server/jar"
          curl -sSL --retry 3 -o mods/fabric-api.jar \
            "https://cdn.modrinth.com/data/P7dR8mSH/versions/6qAuTtLR/fabric-api-0.141.6%2B1.21.11.jar"
          cp ../build/libs/whippets-*.jar mods/
          echo "eula=true" > eula.txt
          # Port 0 keeps the boot from colliding with anything else on the runner.
          printf 'level-type=minecraft\\:flat\nmax-tick-time=-1\nserver-port=0\nonline-mode=false\n' > server.properties

          java -Xmx2G -jar server.jar nogui > boot.log 2>&1 &
          server=$!
          for _ in $(seq 1 90); do
            if grep -qE "Done \(" boot.log 2>/dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true

          echo "--- server log ---"
          grep -E "Loading [0-9]+ mods|whippets [0-9]|biome modifications|Done \(" boot.log || true
          grep -qE "whippets [0-9]+\.[0-9]+\.[0-9]+" boot.log
          grep -qE "Done \(" boot.log
          if grep -qE "Mod resolution failed|Failed to load|Incompatible mod set" boot.log; then
            echo "::error::the mod did not load cleanly"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: whippets-mod
          path: build/libs/*.jar

      # Either a v* tag was pushed, or a version was typed into Run workflow —
      # in which case gh creates the tag on this commit for us.
      - name: Attach the jar to a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          tag="${RELEASE_INPUT:+v$RELEASE_INPUT}"
          tag="${tag:-$GITHUB_REF_NAME}"
          gh release create "$tag" build/libs/whippets-*.jar \
            --title "Whippets $tag" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA"
